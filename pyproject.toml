[project]
name = "zenmoney-mcp"
version = "0.1.0"
description = "MCP server for ZenMoney — view accounts, manage transactions, browse categories and budgets"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["mcp", "zenmoney", "finance", "llm"]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Repository = "https://github.com/germanKoch/zenmoney-mcp"

[project.scripts]
zenmoney-mcp = "zenmoney_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zenmoney_mcp"]
